image: python:3.12

stages:
  - lint
  - format
  - type_check
  - security
  - quality
  - test
  - coverage

before_script:
  - python --version
  - python -m pip install --upgrade "pip>=26.1"
  - pip install ruff mypy bandit pip-audit pytest pytest-cov pylint
  

lint:
  stage: quality
  script:
    - ruff check .

format:
  stage: quality
  script:
    - ruff format --check .

type_check:
  stage: quality
  script:
    - mypy .

quality:
  stage: quality
  script: 
    -  pylint .

security:
  stage: security
  script:
    - bandit -r .

dependency_audit:
  stage: security
  script:
    - pip-audit

test:
  stage: coverage
  script:
    - pytest

coverage_report:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=xml

  artifacts:
    paths:
      - coverage.xml