image: python:3.12

stages:
  - lint
  - format
  - type_check
  - security
  - test
  - coverage

before_script:
  - python --version
  - pip install ruff mypy bandit pip-audit pytest pytest-cov

lint:
  stage: lint
  script:
    - ruff check .

format:
  stage: format
  script:
    - ruff format --check .

type_check:
  stage: type_check
  script:
    - mypy .

security:
  stage: security
  script:
    - bandit -r .

dependency_audit:
  stage: security
  script:
    - pip-audit

test:
  stage: test
  script:
    - pytest

coverage_report:
  stage: coverage
  script:
    - pytest --cov=. --cov-report=xml

  artifacts:
    paths:
      - coverage.xml