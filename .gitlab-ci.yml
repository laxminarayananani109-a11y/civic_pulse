image: python:3.12

stages:
  - test

before_script:
  - python --version
  - pip install ruff bandit pip-audit pytest pytest-cov

lint:
  stage: test
  script:
    - ruff check .

security:
  stage: test
  script:
    - bandit -r .

dependency_audit:
  stage: test
  script:
    - pip-audit

coverage_report:
  stage: test
  script:
    - pytest --cov=. --cov-report=xml || true
  artifacts:
    paths:
      - coverage.xml
