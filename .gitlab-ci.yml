stages:
  - test

test:
  stage: test
  image: python:3.11

  before_script:
    - pip install -r requirements.txt

  script:
    - echo "Running tests"

stages:
  - security

gitleaks:
  stage: security
  image: zricethezav/gitleaks:latest

  script:
    - gitleaks detect --source . --verbose

dependency-audit:
  stage: test
  script:
    - pip install pip-audit
    - pip-audit