image: python:3.12

stages:
  - lint
  - format
  - type_check
  - security
  - test
  - coverage

before_script:
  - python --version
  - pip install ruff bandit pip-audit pytest pytest-cov

lint:
  stage: lint
  script:
    - ruff check .

security:
  stage: security
  script:
    - bandit -r .

dependency_audit:
  stage: dependency_audit
  script:
    - pip-audit

coverage_report:
  stage: coverage_report
  script:
    - pytest --cov=. --cov-report=xml || true
  artifacts:
    paths:
      - coverage.xml
