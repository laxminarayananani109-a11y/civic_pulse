stages:
  - test
  - security

pipeline_check:
  stage: test
  script:
    - echo "Pipeline running successfully"

dependency-audit:
  image: python:3.11
  stage: test
  script:
    - python -m pip install --upgrade pip
    - pip install wheel>=0.46.2
    - pip install pip-audit
    - pip-audit || true

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose || true