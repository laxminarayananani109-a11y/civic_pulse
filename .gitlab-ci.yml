stages:
  - test
  - security

pipeline_check:
  stage: test
  script:
    - echo "Running tests"

dependency-audit:
  image: python:3.11
  stage: test
  script:
    - pip install pip-audit
    - pip-audit || true

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose || true